<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  {% for post in posts %}
    {% if post.status == 0 %}
      <h1>unpublished posts:</h1>
      <h2>{{ post.title }}</h2>
      <p>{{ post.content }}</p>
      <small>{{ post.published_date }}</small>
    {% else %}
      <h1>published posts:</h1>
      <h2>{{ post.title }}</h2>
      <p>{{ post.content }}</p>
      <small>{{ post.published_date }}</small>
    {% endif %}
  {% endfor %}
</body>
</html>
